<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090D"/>
      <stop offset="0.55" stop-color="#0C111B"/>
      <stop offset="1" stop-color="#07100F"/>
    </linearGradient>

    <linearGradient id="signal" x1="72" y1="312" x2="1128" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>

    <linearGradient id="scan" x1="72" y1="312" x2="1128" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.48" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#D9F99D"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>

    <style>
      .orb-a {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbA 9s ease-in-out infinite alternate;
      }

      .orb-b {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbB 11s ease-in-out infinite alternate;
      }

      .ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: ringPulse 6s ease-in-out infinite;
      }

      .signal-base {
        animation: breathe 3.8s ease-in-out infinite;
      }

      .signal-scan {
        stroke-dasharray: 0.13 0.87;
        stroke-dashoffset: 1;
        animation: scan 4.8s linear infinite;
      }

      .node-1 { animation: nodePulse 3s ease-in-out infinite; }
      .node-2 { animation: nodePulse 3s ease-in-out 1s infinite; }
      .node-3 { animation: nodePulse 3s ease-in-out 2s infinite; }

      .node-1, .node-2, .node-3 {
        transform-box: fill-box;
        transform-origin: center;
      }

      .tiny-signal {
        opacity: 0;
        animation: tinySignal 4.8s ease-in-out infinite;
      }

      @keyframes scan {
        from { stroke-dashoffset: 1; }
        to   { stroke-dashoffset: 0; }
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.58; }
        50%      { opacity: 0.92; }
      }

      @keyframes orbA {
        from { transform: translate(-8px, -5px) scale(0.98); }
        to   { transform: translate(10px, 7px) scale(1.04); }
      }

      @keyframes orbB {
        from { transform: translate(7px, 7px) scale(1.03); }
        to   { transform: translate(-11px, -5px) scale(0.97); }
      }

      @keyframes ringPulse {
        0%, 100% { opacity: 0.38; transform: scale(0.96); }
        50%      { opacity: 0.8;  transform: scale(1.08); }
      }

      @keyframes nodePulse {
        0%, 68%, 100% { transform: scale(1); opacity: 0.88; }
        78%            { transform: scale(1.75); opacity: 1; }
        88%            { transform: scale(1); opacity: 0.88; }
      }

      @keyframes tinySignal {
        0%, 7%   { opacity: 0; transform: translateX(-7px); }
        12%, 28% { opacity: 0.8; transform: translateX(0); }
        36%, 100%{ opacity: 0; transform: translateX(7px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb-a, .orb-b, .ring, .signal-base, .signal-scan,
        .node-1, .node-2, .node-3, .tiny-signal {
          animation: none !important;
        }
        .signal-scan { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <g class="orb-a">
    <circle cx="1030" cy="105" r="128" fill="#7C3AED" fill-opacity="0.08"/>
  </g>
  <g class="orb-b">
    <circle cx="1088" cy="148" r="72" fill="#22D3EE" fill-opacity="0.07"/>
  </g>
  <g class="ring">
    <circle cx="985" cy="65" r="38" stroke="#A3E635" stroke-opacity="0.34"/>
  </g>

  <text x="72" y="74" fill="#9AA4B2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" letter-spacing="3">KAMAL REDDY / BUILD LOG</text>
  <text x="72" y="172" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">signal → intelligence → story</text>
  <text x="75" y="224" fill="#AAB4C3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500">ECE × AI systems × product thinking × cinema</text>

  <path class="signal-base" d="M72 312H146L166 288L187 337L209 270L233 350L257 300L280 319L306 312H360L376 312L389 294L406 330L421 282L438 338L454 301L470 318L491 312H555L575 312L592 286L609 339L627 276L644 347L663 297L681 319L702 312H765L784 312L801 291L817 333L834 281L852 340L869 300L888 318L909 312H969L990 312L1007 289L1024 335L1042 278L1060 343L1078 299L1096 319L1128 312" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <path class="signal-scan" pathLength="1" d="M72 312H146L166 288L187 337L209 270L233 350L257 300L280 319L306 312H360L376 312L389 294L406 330L421 282L438 338L454 301L470 318L491 312H555L575 312L592 286L609 339L627 276L644 347L663 297L681 319L702 312H765L784 312L801 291L817 333L834 281L852 340L869 300L888 318L909 312H969L990 312L1007 289L1024 335L1042 278L1060 343L1078 299L1096 319L1128 312" stroke="url(#scan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <g fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    <text x="72" y="377">01 / BUILD USEFUL THINGS</text>
    <text x="370" y="377">02 / MAKE THE HARD PART LEGIBLE</text>
    <text x="798" y="377">03 / SHIP, LEARN, REPEAT</text>
  </g>

  <g stroke="#334155" stroke-width="1.5">
    <path d="M1035 205V244H1080"/>
    <path d="M1080 244V278H1122"/>

    <circle class="node-1" cx="1035" cy="205" r="5" fill="#7C3AED" stroke="none"/>
    <circle class="node-2" cx="1080" cy="244" r="5" fill="#22D3EE" stroke="none"/>
    <circle class="node-3" cx="1122" cy="278" r="5" fill="#A3E635" stroke="none"/>

    <circle class="node-1" cx="1035" cy="205" r="11" fill="#7C3AED" fill-opacity="0.08" stroke="none" filter="url(#softGlow)"/>
    <circle class="node-2" cx="1080" cy="244" r="11" fill="#22D3EE" fill-opacity="0.08" stroke="none" filter="url(#softGlow)"/>
    <circle class="node-3" cx="1122" cy="278" r="11" fill="#A3E635" fill-opacity="0.08" stroke="none" filter="url(#softGlow)"/>
  </g>

  <g class="tiny-signal" transform="translate(1084 189)" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
    <path d="M0 0H10L14 -6L19 8L24 -10L30 6L36 0H48"/>
  </g>
</svg>